spring:
  application:
    name: house-viewing

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/house_viewing}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # docker exec -it mysql-house-viewing mysql -u root -p
  # http://localhost:8080/swagger-ui/index.html

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  # docker exec -it redis redis-cli

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true # sql문을 정렬

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET:house-viewing-storage}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      stack:
        auto: false

logging:
  level:
    root: info
    org.springframework.web.servlet: debug # HTTP 요청 흐름 로그 (컨트롤러, 메서드, 요청, 응답 흐름)
    org.hibernate.SQL: debug # 실제 DB 로그를 보여줌
    org.hibernate.type.descriptor.sql.BasicBinder: trace # sql ? 값을 보여줌

kakao:
  api:
    key: ${KAKAO_REST_API_KEY:}
    url: https://dapi.kakao.com

python:
  api:
    url: ${PYTHON_API_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-at-least-32-chars}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
